# Conductor runtime settings (in git). Validated on load; see conductor/config.py for every field.
executor:
  min_write_interval_s: 1.0      # ≤ 1 write/s per device (Afero attribute guidance; 07 §6)
  account_concurrency: 9         # concurrent requests per Hubspace account (a mode change is a 9-PUT burst)
  max_attempts: 3                # executor-owned retries (aioafero's MAX_RETRIES is forced to 1)
  backoff_s: [1.0, 2.0, 4.0]     # before attempt 2, 3, ... (never below min_write_interval_s)
  readback_delay_s: 1.0          # first verification GET after a 2xx
  readback_attempts: 3
  readback_interval_s: 1.0

reconciler:
  # Rolling true-up: each canopy module is read once per interval, the reads spread evenly (9 modules → one GET
  # every ~0.56 s = 1.8 GET/s on the canopy account; reads are never counted against the write budget). Catches a
  # change made outside the Conductor (the Hubspace app, a controller that lost its look) within the 10 s
  # self-heal target: ≤ 5 s to notice + a tick, a GET, a PUT and the device applying it (make soak measures it).
  true_up_interval_s: 5
  reassert_after_s: 4            # re-check a few seconds after each change
  downgrade_after_wrong_s: 10    # a module wrong longer than this downgrades the mode's tier
  downgrade_throttles: 3         # ... or ≥ this many throttles in the window, per account
  downgrade_throttle_window_s: 60
  upgrade_after_clean_s: 300
  slot_rewrite_min_interval_s: 600
  outage_probe_interval_s: 10

kiosk:
  # Guest pacing (D70): after an accepted guest input (a mood, brightness or on/off) the next one waits until the
  # guests' write budget has paid for it — one write per driven module (most on one account) × 60 / guest_writes_per_min
  # — and never less than cooldown_min_s. Two strands: 2 s; nine modules: 7.5 s. The budget is the account cap
  # (motion.stepped.account_writes_per_min, 90, unmeasured until Gate R) less the same 20% reserve the steps keep.
  cooldown_min_s: 2
  guest_writes_per_min: 72
  idle_return_s: 180
  idle_mode: lowcountry-calm
  guest_brightness_min: 10       # the guest panel can't dim the canopy below this (D60)
  idle_reset_s: 300              # no guest input this long → guest brightness/off cleared: on, designed brightness
  idle_scene: null               # optionally also return to this mood on that reset (null = stay on the current one)
  # The guest panel's picture of the 270 lights: the reflected-ceiling view of config/canopy.yaml (looking up, origin
  # at the canopy's top-left). SET AT INSTALL so the iPad matches what a guest at the stand sees overhead.
  preview:
    mirror_x: false              # flip left to right
    rotate_deg: 0                # 0 | 90 | 180 | 270 (a quarter turn of the ceiling view)
    dim_floor: 0.35              # the dimmest guest level is drawn at this opacity (full brightness at 1)
  # The ripple (D64): a mood chosen on the kiosk, by ops or by the idle return lands ring by ring in its design's
  # order (at most 3 rings; still one PUT per module), this many seconds apart. 0 = one burst. Validated 0–1.5 with
  # (rings − 1) × stagger ≤ 2.4 s. Off until Alon flips it to 1.2: 05's spread target and the pinned acceptance
  # file assume one burst; `make soak` measures a 1.2 s ripple separately.
  ripple_stagger_s: 0

module_page:
  lock_idle_timeout_s: 600
  sweep_step_s: 2.0              # index sweep: one frame write per step, never faster than the rate budget

motion:
  # Stepped looks (D65, conductor/sequence.py): the Conductor sends a module-level design a step at a time, one
  # full-state PUT per module whose colour changes, for a bounded run, then holds the still design. Sim-first.
  stepped:
    live_enabled: false          # off on live hardware until the stepped rehearsal (Gate R) passes; Alon flips it
    min_step_s: 4.0              # never step faster than this
    max_step_s: 12.0             # a step the budget would stretch past this holds the still look instead
    account_writes_per_min: 90   # the account's cap: writes of any kind in any 60 s (Gate R fails above it)
    budget_reserve: 0.2          # steps are planned at the cap less this share (retries, re-sends): 9 modules → 7.5 s
    governor_window_s: 60        # the throttle governor counts a run's write attempts over this window, per account
    governor_min_throttled: 8    # ... and stops the run at ≥ this many 429/403 attempts
    governor_throttled_share: 0.25  # ... that are ≥ this share of the attempts
    governor_cooloff_s: 300      # then stepped runs on that account wait this long (the still look holds)
    fold_guest_within_s: 2.0     # a guest brightness change this close to the next step goes out with that step

lab:
  # The Design Lab's try-on (D66 Slice B): a draft shown at module level on the real lights, one burst, for at most
  # this long, then the approved look is back. Must be at most kiosk.idle_return_s (validated), so the idle hold never
  # swaps the look under a try-on. null = kiosk.idle_return_s. Any other look, a pause, commissioning or a stop ends it.
  trial_max_s: 150
  # Alon, Oct 17: an operator republish of a painted scene repaints its slot at most this often (a sooner publish
  # installs at once, shows the scene at module level and queues the repaint; Revert and Undo are never refused). The
  # reconciler's own drift rewrite stays at reconciler.slot_rewrite_min_interval_s.
  repaint_min_interval_s: 120
  apply_min_gap_s: 8             # the try-on's gap between accepted applies (was kiosk's fixed cooldown before D70)

effects:
  # motionEffect / brightnessEffect codes the bench has enabled. Every code starts disabled (06 #4).
  # Example after the bench: {motionEffect: {1: "scroll (benched Oct 2)"}}
  enabled: {motionEffect: {}, brightnessEffect: {}}
