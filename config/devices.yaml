  # synthesized from aioafero 9.3.0's controller source and UNVERIFIED until a real dump (conductor/sim/profiles.py).
  # Real metadevice ids go in the ops overlay only, after the room's account is connected on the venue box.
  - {id: entry-deadbolt, role: vignette, vignette: entry, kind: lock, account: entry, label: Front door deadbolt, model: Defiant Wi-Fi deadbolt, profile: defiant-deadbolt, writable: true}

  - {id: living-lamp-1, role: vignette, vignette: living, kind: bulb, account: living, label: Table lamp, model: EcoSmart A19 color, profile: ecosmart-a19-rgb, writable: true}
  - {id: living-lamp-2, role: vignette, vignette: living, kind: bulb, account: living, label: Floor lamp, model: EcoSmart A19 color, profile: ecosmart-a19-rgb, writable: true}
  - {id: living-lamp-3, role: vignette, vignette: living, kind: bulb, account: living, label: Wash left, model: EcoSmart A19 color, profile: ecosmart-a19-rgb, writable: true}
  - {id: living-lamp-4, role: vignette, vignette: living, kind: bulb, account: living, label: Wash right, model: EcoSmart A19 color, profile: ecosmart-a19-rgb, writable: true}
  - {id: living-plug, role: vignette, vignette: living, kind: plug, account: living, label: Tree and garland, model: "Defiant outdoor plug, 2 outlets", profile: outdoor-plug-2, writable: true}

