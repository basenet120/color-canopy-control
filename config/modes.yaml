        moving_feature: "Colour and dimming through the Hubspace cloud: each Hubspace strand set to a single colour and sent its next colour every few seconds, so the dusk colours move in toward the centre: dusk violet and rose, then coral and apricot glow."
      strand:
        look: {kind: rgb, rgb: [255, 138, 122], brightness: 85}   # coral
        feature: "Colour and dimming: all nine Hubspace strands set to coral."

