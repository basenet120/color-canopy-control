          brightness: 85
        feature: "Colour and dimming: each Hubspace strand set to a single colour, so the palette is laid out diagonally along the fins, a different colour on every strand: butter yellow toward one corner, mint and sky blue across the middle, lavender toward the opposite corner."
      stepped:   # D77: a stroll down the row, house by house
        canvas: *rainbow-row-sunset-2-design
        direction: forward
        steps_per_cycle: 6
        step_s: 6   # design pace; nine strands on one account step every 7.5 s (motion.stepped budget)
        run_s: 90
        brightness: 85
        moving_feature: "Colour and dimming through the Hubspace cloud: each Hubspace strand set to a single colour and sent its next colour every few seconds, so the facade colours move diagonally across the canopy, house by house: facade pink, then butter yellow, mint, sky blue, lavender and apricot."
      strand:
        look: {kind: rgb, rgb: [246, 184, 200], brightness: 85}   # facade pink
        feature: "Colour and dimming: all nine Hubspace strands set to facade pink."

  rainbow-row-sunset-3:
    label: "Rainbow Row Sunset #3"
    blurb: Stay a little longer
