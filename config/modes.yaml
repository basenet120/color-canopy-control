        feature: "Colour and dimming: each Hubspace strand set to a single colour, so the palette is laid out from the centre out: apricot glow in the middle, coral around it, rose at the corners."
      stepped:   # D77: the light draws in toward the deep centre
        canvas: *rainbow-row-sunset-3-design
        direction: reverse
