              - {at: 0.4, color: mint}
              - {at: 0.6, color: sky-blue}
              - {at: 0.8, color: rainbow-row-sunset-2-lavender}
              - {at: 1.0, color: rainbow-row-sunset-2-apricot}
            recipe: rgb_only
