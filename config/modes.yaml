# The Lowcountry Modes (02, 04 "Canopy control model"), as data: the six scenes and their 12 review options (D77).
# The engine compiles each mode to exactly one PUT per module. Every technique carries the "Hubspace feature"
# statement the kiosk shows WHILE THAT TECHNIQUE IS IN USE — copy follows the tier actually running (05 #12, 07 §6).
# Statements never say the Hubspace app paints the 270 heads as one canvas, and never credit non-Hubspace light to
# Hubspace.
#
# The modes ARE the scenes (config/scenes.yaml, D59, D77), in the catalog's order: each mode's id, label (the scene's
# name), blurb (its mood) and preview (its palette, in order) match the scene, and every technique renders the
# scene's palette (tests/test_modes_match_scenes.py checks all of this).
#
# Each scene is ONE 2-D design over the canopy (D63, superseding D59's x / 225 gradient): a `field` canvas
# (conductor/looks/field.py; canopy inches, reflected-ceiling view, x from the left edge, y from the top edge) with
# the palette's colours as evenly spaced stops, painted with `rgb_only` palette recipes (config/recipes.yaml). A YAML
# anchor names it once, so the same design drives every tier that draws it:
#   canvas  — T1: the design at each of the 270 heads.
#   slot    — T2: a design hand-painted in the Hubspace app into the mode's slot (the reconciler verifies its hash).
#   modules — T3: each module set to one colour: the design sampled at the module's centre (`at: centre`,
#             ((col + ½)·75, (row + ½)·40) in), at the scene's brightness. The `feature` names the design's layout
#             in the words `field.layout_words` requires ("diagonally", "from the centre out", "from one edge", …).
#   stepped — module level, a step at a time: the same design re-sent every few seconds (below).
#   strand  — the scene's solid colour (its `default_solid`) on every strand.
# The layouts (D77, re-fit to VWBD's fins, D74; drafts for the client session):
#   - the fin rings (`kind: fins`): eight designs, Coastal Tides #1 and The Goodnight Glow #1 among them. Module level
#     reads them as three rings (the deep centre, the edge-middles, the corners), whatever the palette.
#   - tilted rings: Lowcountry Calm #1 and Garden Gathering #1, a radial in the canopy's proportions from
#     [122.5, 67.5], 12.5 in off the middle along the fins' current (Calm's radius_in 130 so that four colours read).
#   - along the fins' current: Rainbow Row Sunset #1 and #2 and Golden Hour #3 at 18° (31.4° in true inches: a linear
#     field measures angles in the canopy's proportions), Lowcountry Calm #3 at 22° folded, Coastal Tides #2 and
#     Garden Gathering #3 (its warm pools) at 140° folded, the bands along the current.
#   - Golden Hour #1's sun at the middle of the left edge, stretched (radius_in 225) so the deep centre is sunset
#     pink; Coastal Tides #3 a lighthouse sweep around a spot just off the middle.
# Changing a design changes the T1 frames, so every recorded slot hash of a painted scene goes stale: freeze the
# designs before commissioning at install (D63).
# Brightness is the scene's `brightness_draft` at every tier (a device setting; colours stay full strength). No mode
# has an on-device motion effect (the soak may enable a SIMULATED one, config/sim/soak.yaml).
#
# Every scene moves (D75, D77, superseding D59's "every scene is static" and D65's two moving scenes): each mode has a
# `stepped` rung just before [modules, strand]. The Conductor re-sends the scene's own design (the same `&…` anchor,
# so the still look it holds is the scene's module-level rung exactly) a step at a time, one colour and one
# brightness per strand through the Hubspace cloud every few seconds, for a bounded run (`run_s`); then the still
# design holds (a painted scene's best still rung where available). `mode` says how: `travel` (the default; eleven
# modes) moves the design along its layout; `breathe` (five) keeps it in place and swings each strand's colour along
# the design (`shift`) and/or its level (`brightness_swing`), the design's start leading by up to `lag_steps`;
# `shimmer` (two) is a breath whose strands start on their own `seed`ed rhythms. Live hardware refuses the stepped
# rung until the stepped rehearsal (Gate R) passes and Alon sets motion.stepped.live_enabled (config/conductor.yaml);
# until then the ladder lands on the next rung. Lowcountry Calm #1 is the idle look: start-up and an idle return show
# it still unless motion.idle is on (D75). `motion` stays false (07 §6's on-device burst flag, which a stepped look
# never uses).
#
# Only three modes have a canvas: the controller holds three custom slots (custom-1..3) and painted looks are stored
# at commissioning and only selected at show time (store-and-select, 04), so three slots hold three painted looks.
# The other fifteen start at their stepped rung, then module level (T3).
#
# Techniques:
#   strand  — one whole-strand look on every module (white / rgb / preset / program), rows.Look fields
#   canvas  — T1: a look designed in canopy inches over all 270 heads, split into nine frames, written into `slot`
#             at commissioning and only SELECTED at show time (store-and-select, 04)
#   slot    — T2: select `slot`, hand-painted in the Hubspace app (the reconciler verifies its hash, never rewrites)
#   modules — T3: module-level composition: each module = one coarse pixel (a strand look per canopy position)
#   stepped — module level, a step at a time (D65, D75): the modules rung's design moved along its layout (travel) or
#             breathed in place (breathe, shimmer) every `step_s` (more on a busy account: the rate budget, 07 §6),
#             `steps_per_cycle` steps per repeat or per breath, for `run_s`; then the still design holds.
#             `moving_feature` is shown only while a run moves. Keys left out take their defaults (mode travel;
#             shift, brightness_swing and lag_steps 0; no seed); the Lab's export adds their lines when it sets them.
#
# `ladder` is tried in order; the engine uses the first tier the capabilities + bench flags allow, and downgrades
# with hysteresis (07 §6). Colours name entries in config/recipes.yaml.
kiosk:
  title: The Color Canopy
  prompt: "Choose a mood. Watch the light change."
  tagline: "Make it your mood."
  resting: "The canopy is resting. It will be back shortly."
  updating: "Changing the light…"
  ready: "Ready"

modes:
  lowcountry-calm:
    label: "Lowcountry Calm #1"
    blurb: Settle in
    preview: ["#F7F2E7", "#D1EAE3"]
    ladder: [stepped, modules, strand]
    techniques:
      modules:
        sample:
          canvas: &calm-design   # tilted rings: sea glass 12.5 in off the middle along the fins' current, soft ivory at the corners
            kind: field
            # radius_in 130, not auto: with auto only three module colours read apart; the r0c0 corner is then almost
            # pure soft ivory
            field: {kind: radial, centre_in: [122.5, 67.5], metric: canopy, radius_in: 130, invert: true}
            stops:
              - {at: 0.0, color: soft-ivory}
              - {at: 1.0, color: sea-glass}
            recipe: rgb_only
          at: centre
          brightness: 70
        feature: "Colour and dimming: each Hubspace strand set to a single colour, so the palette is laid out from one spot just off the middle: sea glass there, paling toward soft ivory at the corners."
      stepped:   # D77: a colour-only breath, the sea glass near the middle first
        canvas: *calm-design
        mode: breathe
        direction: forward
        shift: 0.4
        lag_steps: 1
        steps_per_cycle: 4
        step_s: 8   # design pace; nine strands on one account step every 8 s (motion.stepped budget)
        run_s: 120
        brightness: 70
        moving_feature: "Colour and dimming through the Hubspace cloud: each Hubspace strand set to a single colour and sent its next colour every few seconds, so the sea glass near the middle drifts and settles across the canopy and back."
      strand:
        look: {kind: rgb, rgb: [247, 242, 231], brightness: 70}   # soft ivory
        feature: "Colour and dimming: all nine Hubspace strands set to soft ivory."

  lowcountry-calm-2:
    label: "Lowcountry Calm #2"
    blurb: Settle in
    preview: ["#FFF3DC", "#F3E6CF", "#BFE3DF"]
    ladder: [stepped, modules, strand]
    techniques:
      modules:
        sample:
          canvas: &lowcountry-calm-2-design   # the fin rings: porch light on the deep centre, warm linen around it, haint blue toward the rim
            kind: field
            field: {kind: fins}
            stops:
              - {at: 0.0, color: porch-light}
              - {at: 0.5, color: warm-linen}
              - {at: 1.0, color: haint-blue}
            recipe: rgb_only
          at: centre
          brightness: 70
        feature: "Colour and dimming: each Hubspace strand set to a single colour, so the palette is laid out from the centre out: porch light in the middle, warm linen around it, a touch of haint blue at the corners."
      stepped:   # D77: a level-only breath, the deep centre first
        canvas: *lowcountry-calm-2-design
        mode: breathe
        direction: forward
        brightness_swing: 10
        lag_steps: 1
        steps_per_cycle: 4
        step_s: 8   # design pace; nine strands on one account step every 8 s (motion.stepped budget)
        run_s: 120
        brightness: 70
        moving_feature: "Colour and dimming through the Hubspace cloud: each Hubspace strand set to a single colour and sent a brighter or softer level every few seconds, so the porch-light glow swells and softens across the canopy."
      strand:
        look: {kind: rgb, rgb: [191, 227, 223], brightness: 70}   # haint blue
        feature: "Colour and dimming: all nine Hubspace strands set to haint blue."

  lowcountry-calm-3:
    label: "Lowcountry Calm #3"
    blurb: Settle in
    preview: ["#EEE6DA", "#CFDDBE", "#D3E2EA"]
    ladder: [stepped, modules, strand]
    techniques:
      modules:
        sample:
          canvas: &lowcountry-calm-3-design   # along the fins' current, folded: mist blue across the middle, oyster shell toward two far corners
            kind: field
            field: {kind: linear, angle_deg: 22, transform: mirror}
            stops:
              - {at: 0.0, color: oyster-shell}
              - {at: 0.5, color: spartina}
              - {at: 1.0, color: mist-blue}
            recipe: rgb_only
          at: centre
          brightness: 70
        feature: "Colour and dimming: each Hubspace strand set to a single colour, so the palette is laid out diagonally along the fins: mist blue across the middle, spartina either side, oyster shell toward two far corners."
      stepped:   # D77: the marsh bands move along the fins
        canvas: *lowcountry-calm-3-design
        direction: forward
        steps_per_cycle: 8
        step_s: 6   # design pace; nine strands on one account step every 7.5 s (motion.stepped budget)
        run_s: 120
        brightness: 70
        moving_feature: "Colour and dimming through the Hubspace cloud: each Hubspace strand set to a single colour and sent its next colour every few seconds, so the marsh colours move diagonally across the canopy along the fins: oyster shell, then spartina and mist blue."
      strand:
        look: {kind: rgb, rgb: [211, 226, 234], brightness: 70}   # mist blue
        feature: "Colour and dimming: all nine Hubspace strands set to mist blue."

  rainbow-row-sunset:
    label: "Rainbow Row Sunset #1"
