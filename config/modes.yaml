  golden-hour:
    label: "Golden Hour #1"
    blurb: Let the evening glow
    preview: ["#FFDB9B", "#FFB69D", "#FF9BC4", "#E779B0", "#B59AE2"]
    ladder: [canvas, slot, stepped, modules, strand]
    slot: custom-3
    techniques:
      canvas:
        canvas: &golden-design   # a sun at the middle of the left edge: soft gold there, sunset pink on the deep centre, lavender toward the far corners
          kind: field
          # metric: canopy measures in the canopy's proportions (a ring is an ellipse that fills it), so the sun's arc
          # shows at module level: in true inches the 40 in between rows barely changes the distance from (0, 60)
          # and T3 read as D59's three columns. radius_in 225 (D77) stretches the sun so the deep centre (r1c1) is
          # exactly sunset pink, the middle stop: the stops stay evenly spaced.
          field: {kind: radial, centre_in: [0, 60], metric: canopy, radius_in: 225}
          stops:
            - {at: 0.0, color: soft-gold}
            - {at: 0.25, color: golden-hour-peach}
            - {at: 0.5, color: sunset-pink}
            - {at: 0.75, color: rose}
            - {at: 1.0, color: lavender}
          recipe: rgb_only
        brightness: 95
        feature: "Every one of the 270 lights set individually, saved as a Hubspace custom pattern on each of nine strands."
      slot:
        brightness: 95
        feature: "A custom pattern painted light by light in the Hubspace app, saved on each strand."
      modules:
        sample: {canvas: *golden-design, at: centre, brightness: 95}
        feature: "Colour and dimming: each Hubspace strand set to a single colour, so the palette is laid out from one edge: gold and peach at the middle of one short side, pinker toward its corners, sunset pink in the middle, rose and lavender at the far side."
      stepped:   # D65: the sun's rays move out from the left edge, then the per-head sun holds where available
        canvas: *golden-design
        direction: forward      # outwards from the sun
        steps_per_cycle: 6
        step_s: 6   # design pace; nine strands on one account step every 7.5 s (motion.stepped budget)
        run_s: 90
        brightness: 95
        moving_feature: "Colour and dimming through the Hubspace cloud: each Hubspace strand set to a single colour and sent its next colour every few seconds, so the sunset's colours move out from one edge like rays from a low sun: gold and peach, then sunset pink, rose and lavender."
