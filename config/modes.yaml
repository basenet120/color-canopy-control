    ladder: [canvas, slot, stepped, modules, strand]
    slot: custom-2
    techniques:
      canvas:
        canvas: &garden-design   # tilted rings: ivory 12.5 in off the middle along the fins' current, sage green toward the corners
          kind: field
          field: {kind: radial, centre_in: [122.5, 67.5], metric: canopy, invert: true}
