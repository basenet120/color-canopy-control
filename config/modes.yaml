        feature: "Colour and dimming: each Hubspace strand set to a single colour, so the palette is laid out from one spot just off the middle: ivory there, pale lime around it, sage green toward the corners."
      stepped:   # D77: the garden gathers in, then the painted design holds where available
        canvas: *garden-design
