        feature: "Every one of the 270 lights set individually, saved as a Hubspace custom pattern on each of nine strands."
      slot:
        brightness: 85
        feature: "A custom pattern painted light by light in the Hubspace app, saved on each strand."
      modules:
        sample: {canvas: *sunset-design, at: centre, brightness: 85}
        feature: "Colour and dimming: each Hubspace strand set to a single colour, so the palette is laid out diagonally along the fins: pastel coral toward one corner, blush pink across the middle, lilac toward the opposite corner."
      stepped:   # D77: the facade colours move along the fins, then the painted design holds where available
        canvas: *sunset-design
        direction: forward
        steps_per_cycle: 6
        step_s: 6   # design pace; nine strands on one account step every 7.5 s (motion.stepped budget)
        run_s: 90
        brightness: 85
        moving_feature: "Colour and dimming through the Hubspace cloud: each Hubspace strand set to a single colour and sent its next colour every few seconds, so the facade colours move diagonally across the canopy along the fins: pastel coral, then blush pink and lilac."
      strand:
        look: {kind: rgb, rgb: [255, 158, 150], brightness: 85}   # pastel coral
        feature: "Colour and dimming: all nine Hubspace strands set to pastel coral."

