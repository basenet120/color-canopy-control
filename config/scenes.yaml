# The Color Canopy scene catalog: the six approved scenes (D59), each followed by its two review options (D77).
# Source of the six: Paris's six-scene handoff (ALON-SIX-SCENES.json, 2026-10-07), generated from
# web/ops/showcase/demo-model.mjs (sha256 a56cedcd…9c4d). Their ids and palette colours are approved and must not
# change; for the client review their names carry "#1" (until PR E, or a Design Lab rename at the session) and
# Lowcountry Calm #1's description is the preset-options plan's draft (needs the D59 sign-off).
# The review options (D77; docs/plans/preset-options/README.md §4) are `<id>-2` and `<id>-3`, named "<name> #n", with
# `option_of: <id>` on the line after `- id:` (the iPad groups them under their base, D76; the nickname after it is a
# comment, not client copy). Their palettes, names and descriptions are drafts, unapproved until the client session
# (D59) and Prototype 01's colour study. Brightness values are editable drafts (physical mood approval pending).
# Gradient rule, per strand of 30 heads: t = head / 29, linear interpolation between evenly spaced palette stops in
# RGB, rounded per channel; transform `mirror` replaces t with 1 - |2t - 1| (Lowcountry Calm #1). The options' strips
# are linear: a palette strip, not a picture. No scene uses an on-device effect (motionEffect 0, brightnessEffect 0);
# a scene moves only through its stepped rung in config/modes.yaml (D75, D77).
