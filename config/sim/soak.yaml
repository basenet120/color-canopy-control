# Soak-only settings — SIMULATED, never used by the running Conductor (07 §6: sim-only motion semantics live here).
# The soak (`make soak`) runs the show's own wiring with this on-device motion code enabled for one mode, so the
# all-or-none motion re-trigger is measured. No motion code has been benched: the number is arbitrary, the simulator
# doesn't animate anything, and the report labels it SIMULATED. No show scene has an on-device effect (D59; a scene
# moves only through its stepped rung, D75/D77), so the mode named here must have a canvas (a painted slot) and the
# soak adds `feature` as its motion copy. The pinned acceptance conditions are in acceptance.yaml.
motion:
  mode: golden-hour
  motionEffect: 1
  note: "SIMULATED scroll (soak only; nothing benched)"
  feature: "SIMULATED on-device motion in a saved Hubspace custom pattern (soak only; never shown to guests)."

# The ripple scenario (D64), also soak-only and SIMULATED: a separate, shorter run of the show's own wiring with
# kiosk.ripple_stagger_s set to `stagger_s` (the show's own setting stays 0 = one burst until Alon flips it), `changes`
# kiosk mood changes `spacing_s` (+ up to 2 s, seeded) apart under the pinned acceptance conditions. Every scene has a
# stepped rung since D77 and a guest's choice runs it first (D75), so the ripple's config copy strips every stepped
# rung: each mood lands as its still look (canvas, slot or modules) ring by ring, which is what live hardware does
# until Gate R and motion.stepped.live_enabled. Targets: every module correct within (rings − 1) × stagger +
# `settle_extra_s` at p95; exactly one PUT per module per change, none before its ring; no downgrades. Each ring's
# landing spread (05's spread target, per ring: p95 ≤ `ring_spread_p95_s`) is reported for D64, not gating, while the
# show runs one burst.
ripple:
  stagger_s: 1.2
  changes: 60
  spacing_s: 12
  ring_spread_p95_s: 2.0
  settle_extra_s: 5.0

# The stepped scenario (D65, D75, D77; per light since Oct 21), also soak-only and SIMULATED: a separate, shorter run
# of the show's own wiring. In the simulator every look runs its per-light rung (`techniques.stepped.lights`): the
# #1-#3 looks are still pictures (one frame, sent again whole one step later, then held), the #4-#6 and Light Show
# looks move and LOOP in whole laps until the next choice, nine kits every 2 s (motion.lights' cap less the reserve).
# `modes` covers every kind: still pictures (Golden Hour #1, which then settles onto its commissioned canvas, and
# Coastal Tides #1, a fins-ring picture that holds its own frame) and moving looks (a ripple, a twinkle, a glow and a
# breathe). `runs` kiosk choices cycle them. A moving run is watched for one whole lap plus `watch_extra_steps` steps
# (past its loop seam: it must still be running) and then the next guest choice replaces it; a still run must end on
# its own within its run (+ `still_end_slack_s`) and its frame hold on all nine until the next choice, `hold_s` (+ up
# to 2 s, seeded) later. Every `interrupt_every`-th run, when it moves, is cut short by another mood chosen mid-run
# (never the idle look or the idle scene). The moving looks sit at the interrupted places (runs 4, 8, 12).
# Then no input: the scenario's config copy sets kiosk.idle_reset_s to `idle_reset_s` and kiosk.idle_return_s to
# `idle_return_s` (the show's are an hour and a day), and the canopy must go to kiosk.idle_scene (Light Show #2)
# `idle_reset_s` (+ `idle_slack_s`) after the last choice and run and loop there, then to kiosk.idle_mode
# `idle_return_s` (+ slack) after that, still (no runner: motion.idle is off). `idle_reset_s: null` skips the idle
# checks. A candidate without a rung of its own (none since D77) would get a SIMULATED module-level rung just before
# `modules` from `technique`. Targets (proposed, not in the pinned acceptance.yaml until Alon signs them off): each
# step on all its modules (per-light allowance), one PUT per changed module per step, <= the cap in force in any
# 60 s on the account, no governor trip and no downgrade at 5% throttling, steps neither failed nor skipped, the
# still pictures end and hold, the moving looks loop, the idle reset and the idle hold. Each step's landing spread
# (p95 <= `step_spread_p95_s`) is reported, not gating.
stepped:
  modes: [golden-hour, coastal-tides-4, coastal-tides, garden-gathering-4, light-show-3, golden-hour-5]
  technique: {direction: forward, steps_per_cycle: 6, step_s: 6, run_s: 90}
  runs: 12
  hold_s: 20
  watch_extra_steps: 3
  interrupt_every: 4
  still_end_slack_s: 2
  step_spread_p95_s: 2.0
  idle_reset_s: 240
  idle_return_s: 600
  idle_slack_s: 10
