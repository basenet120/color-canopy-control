# Colour recipes (06 #7): how each named show colour is made on a puck. Starting points only — every value here
# is UNVERIFIED until Prototype 01's colour study (clear + frosted Mylar, show brightness, photographed at equal
# exposure). Tune here, not in code.
#
# Each colour has:
#   rgb_only: a frame entry that uses only the RGB die (cct 0, whiteBrightness 0)
#   blend:    RGB plus the warm-white LEDs in the same puck (cct + whiteBrightness) — needs per-puck white to be
#             honoured by the device (bench gate 6, "per-puck white"); if it isn't, blend == rgb_only visually
#   strand:   the whole-strand fallback (T3): a `color-rgb` value or a white `cct`
#
# Three groups:
#   - the scene palette colours (D59, D63): the approved palettes of the six scenes (config/scenes.yaml, the "#1" of
#     each scene since D77) — the painted three since D59, and Lowcountry Calm, Coastal Tides and The Goodnight Glow
#     since D63, whose module level (T3) samples the same kind of design. Each is the palette hex at full strength
#     (colorBrightness 100 — brightness is the device setting, never multiplied in). The palettes are RGB designs and
#     per-puck white is unverified (gate 6), so `blend` is the same RGB with no white; config/modes.yaml paints them
#     with `rgb_only`. A key is the colour's name, or <scene id>-<name> when that name is already taken by another
#     colour.
#   - the 12 review options' new colours (D77: <id>-2 and <id>-3 of each scene): made the same way, one key per
#     colour, in catalog order. Drafts, unapproved until the client session (D59).
#   - the colour-study colours (HD orange, amber, …): the module page's colour and recipe-compare cards
#     (conductor/module/cards.py). No mode uses them since D59; the options never reuse them (their rgb_only isn't
#     the hex, or their blend has white).
