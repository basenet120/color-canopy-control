    blend: {r: 230, g: 238, b: 209, colorBrightness: 100}
    strand: {rgb: [230, 238, 209]}
  ivory:
    label: Ivory
    hex: "#F7F2E7"
    rgb_only: {r: 247, g: 242, b: 231, colorBrightness: 100}
    blend: {r: 247, g: 242, b: 231, colorBrightness: 100}
    strand: {rgb: [247, 242, 231]}
  # Golden Hour
  soft-gold:
    label: Soft gold
    hex: "#FFDB9B"
    rgb_only: {r: 255, g: 219, b: 155, colorBrightness: 100}
    blend: {r: 255, g: 219, b: 155, colorBrightness: 100}
    strand: {rgb: [255, 219, 155]}
  golden-hour-peach:
    label: Peach
    hex: "#FFB69D"
    rgb_only: {r: 255, g: 182, b: 157, colorBrightness: 100}
    blend: {r: 255, g: 182, b: 157, colorBrightness: 100}
    strand: {rgb: [255, 182, 157]}
  sunset-pink:
    label: Sunset pink
    hex: "#FF9BC4"
    rgb_only: {r: 255, g: 155, b: 196, colorBrightness: 100}
    blend: {r: 255, g: 155, b: 196, colorBrightness: 100}
    strand: {rgb: [255, 155, 196]}
  rose:
    label: Rose
    hex: "#E779B0"
    rgb_only: {r: 231, g: 121, b: 176, colorBrightness: 100}
    blend: {r: 231, g: 121, b: 176, colorBrightness: 100}
    strand: {rgb: [231, 121, 176]}
  lavender:
    label: Lavender
    hex: "#B59AE2"
    rgb_only: {r: 181, g: 154, b: 226, colorBrightness: 100}
    blend: {r: 181, g: 154, b: 226, colorBrightness: 100}
