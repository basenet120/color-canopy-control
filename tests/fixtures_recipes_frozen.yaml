# Today's scene-palette recipes, frozen (Design Lab PLAN §3.7): the 20 entries of config/recipes.yaml's scene palette
# section as approved on 2026-10-16, verbatim. The compiler tests' fixtures (tests/fixtures_modes_field.yaml,
# fixtures_modes_stepped.yaml, fixtures_modes_techniques.yaml) name these keys; those tests compile against config's
# recipes with these entries laid over them, so a Design Lab export that renames, adds or removes a scene colour (and so
# drops or adds a key in config/recipes.yaml) can't break them. Never regenerated: edit by hand only if a fixture needs
# a new colour.
