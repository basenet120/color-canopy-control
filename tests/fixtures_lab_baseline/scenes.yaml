# The six approved Color Canopy scenes — the single scene catalog (D59).
# Source: Paris's six-scene handoff (ALON-SIX-SCENES.json, 2026-10-07), generated from web/ops/showcase/demo-model.mjs
# (sha256 a56cedcd…9c4d). Names, ids and palette colours are approved and must not change; brightness values are
# editable drafts (physical mood approval pending). Gradient rule, per strand of 30 heads: t = head / 29, linear
# interpolation between evenly spaced palette stops in RGB, rounded per channel; transform `mirror` replaces t with
# 1 - |2t - 1| (Lowcountry Calm). Every scene is static (motionEffect 0, brightnessEffect 0).
scenes:
  - id: lowcountry-calm
    name: "Lowcountry Calm"
    mood: "Settle in"
    description: "Soft ivory with a pale sea-glass center for a calm, airy setting."
    transform: mirror
    brightness_draft: 70
    default_solid: 0
    palette:
      - {name: "Soft ivory", hex: "#F7F2E7"}
      - {name: "Sea glass", hex: "#D1EAE3"}
  - id: rainbow-row-sunset
    name: "Rainbow Row Sunset"
    mood: "Stay a little longer"
