# Colour recipes (06 #7): how each named show colour is made on a puck. Starting points only — every value here
# is UNVERIFIED until Prototype 01's colour study (clear + frosted Mylar, show brightness, photographed at equal
# exposure). Tune here, not in code.
#
# Each colour has:
#   rgb_only: a frame entry that uses only the RGB die (cct 0, whiteBrightness 0)
#   blend:    RGB plus the warm-white LEDs in the same puck (cct + whiteBrightness) — needs per-puck white to be
#             honoured by the device (bench gate 6, "per-puck white"); if it isn't, blend == rgb_only visually
#   strand:   the whole-strand fallback (T3): a `color-rgb` value or a white `cct`
#
# Two groups:
#   - the scene palette colours (D59, D63): the approved palettes of all six scenes (config/scenes.yaml) — the
#     painted three since D59, and Lowcountry Calm, Coastal Tides and The Goodnight Glow since D63, whose module
#     level (T3) samples the same kind of design. Each is the palette hex at full strength (colorBrightness 100 —
#     brightness is the device setting, never multiplied in). The palettes are RGB designs and per-puck white is
#     unverified (gate 6), so `blend` is the same RGB with no white; config/modes.yaml paints them with `rgb_only`.
#     A key is the colour's name, or <scene id>-<name> when that name is already taken by another colour.
#   - the colour-study colours (HD orange, amber, …): the module page's colour and recipe-compare cards
#     (conductor/module/cards.py). No mode uses them since D59.
colors:
  # ---- scene palette colours (D59) ----------------------------------------------------------------------------
  # Rainbow Row Sunset
  pastel-coral:
    label: Pastel coral
    hex: "#FF9E96"
    rgb_only: {r: 255, g: 158, b: 150, colorBrightness: 100}
    blend: {r: 255, g: 158, b: 150, colorBrightness: 100}
    strand: {rgb: [255, 158, 150]}
