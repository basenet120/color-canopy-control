[project]
name = "color-canopy-conductor"
version = "0.1.0"
description = "Control system for The Color Canopy (Home Depot x Hearst, Charleston 2026)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "cryptography>=43",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Live Hubspace control. Pinned exactly: aioafero shipped three breaking majors in 2026.
live = ["aioafero==9.3.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "playwright==1.56.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["research"]
