<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Bench clock · Color Canopy</title>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/ops/bench/clock/clock.css">
</head>
<body class="clock-page">
<div id="flash" class="flash" aria-hidden="true"></div>
<main class="clock-main">
  <div id="time" class="digits" aria-live="off">--:--:--.---</div>
  <div id="put" class="put" role="status">Waiting for a bench write…</div>
  <div class="meta">
    <span id="offset">Measuring the offset to the server clock…</span>
    <span id="live">Connecting…</span>
    <span id="wake"></span>
  </div>
  <div class="controls">
    <button id="full" type="button" class="secondary">Full screen</button>
    <a class="btn secondary" href="/ops/bench/">Back to the bench</a>
  </div>
</main>
<script type="module" src="/ops/bench/clock/clock.js"></script>
</body>
</html>
