<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="light">
  <title>The Color Canopy</title>
  <!--
    The canopy touchscreen's resting page on the venue box (not served by the Conductor). install.sh ships it to
    /opt/canopy/kiosk/resting.html; kiosk-prestart.sh copies it where the Chromium snap can read it, and the kiosk
    unit opens it as file://…?next=<kiosk URL>. So from the moment Chromium starts (boot, a relaunch, break-glass),
    the screen says the canopy is resting instead of showing the desktop or a browser error. It asks the Conductor's
    /healthz every 2 s and opens `next` (the canopy page, or a setup link while canopy-kiosk-enroll runs) once it
    answers. Everything is inline: a file:// page can load nothing else. The copy matches the kiosk's own resting
    screen (web/kiosk/index.html).
  -->
  <style>
    :root {
      --serif: "Iowan Old Style", "Bitstream Charter", Charter, "Palatino Linotype", Palatino, "Book Antiqua",
        ui-serif, Georgia, "Noto Serif", "Liberation Serif", serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      --paper: #F7F1E6;
      --ink: #2E2A26;
      --ink-soft: #6A6158;
      --orange-ink: #B34700;
      --u: min(1vw, 1.78vh);
    }
    html, body { margin: 0; height: 100%; }
    body {
      overflow: hidden;
      cursor: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      display: grid;
      place-items: center;
      background:
        radial-gradient(80vmax 60vmax at 50% 38%, #FFF6E6 0%, rgba(255, 246, 230, 0) 70%),
        var(--paper);
      color: var(--ink);
    }
    .glow {
      position: fixed; left: 50%; top: 38%;
      width: 56vmin; height: 56vmin; margin: -28vmin 0 0 -28vmin;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 217, 168, 0.85) 0%, rgba(247, 201, 139, 0.35) 40%, rgba(247, 201, 139, 0) 70%);
      filter: blur(8px);
      animation: rest 7s ease-in-out infinite;
    }
    @keyframes rest {
      0%, 100% { transform: scale(0.94); opacity: 0.75; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    .copy { position: relative; text-align: center; padding: 0 8vw; }
    .eyebrow {
      margin: 0;
      font: 600 calc(var(--u) * 1.05) / 1.2 var(--sans);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--orange-ink);
    }
    h1 {
      margin: calc(var(--u) * 1) 0 0;
      font: 400 calc(var(--u) * 6.4) / 1.02 var(--serif);
      letter-spacing: -0.012em;
    }
    .text {
      margin: calc(var(--u) * 2.2) auto 0;
      max-width: 28em;
      font: 400 calc(var(--u) * 2.3) / 1.4 var(--serif);
      color: var(--ink-soft);
    }
    .tagline {
      margin: calc(var(--u) * 3.2) 0 0;
      font: italic 400 calc(var(--u) * 2.6) / 1.1 var(--serif);
      color: var(--orange-ink);
    }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="copy" aria-live="polite">
    <p class="eyebrow">Six Lowcountry Modes</p>
    <h1>The Color Canopy</h1>
    <p class="text">The canopy is resting. It will be back shortly.</p>
    <p class="tagline">Make it your mood.</p>
  </main>
  <script>
    (() => {
      "use strict";
      // Only the Conductor on this box, never anywhere else, whatever the URL says.
      const ORIGINS = ["http://localhost:8000", "http://127.0.0.1:8000"];
      const DEFAULT_NEXT = "http://localhost:8000/kiosk/";
      const POLL_MS = 2000;
      const TIMEOUT_MS = 3000;

      function nextUrl(search) {
        let next = "";
        try {
          next = new URLSearchParams(search).get("next") || "";
          if (!ORIGINS.includes(new URL(next).origin)) next = "";
        } catch (_) {
          next = "";
        }
        return next || DEFAULT_NEXT;
      }

      const next = nextUrl(location.search);
      const health = new URL("/healthz", next).href;

      // A file:// page can't read another origin's answer, so this asks in no-cors mode: the promise resolves
      // (opaquely) whenever the Conductor answers at all, and rejects while nothing listens on the port.
      async function answers() {
        const abort = new AbortController();
        const timer = setTimeout(() => abort.abort(), TIMEOUT_MS);
        try {
          await fetch(health, { mode: "no-cors", cache: "no-store", signal: abort.signal });
          return true;
        } catch (_) {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      async function poll() {
        if (await answers()) {
          location.replace(next);
          return;
        }
        setTimeout(poll, POLL_MS);
      }

      poll();
    })();
  </script>
</body>
</html>
